name: Build

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag（留空则自动生成 dev 版本）'
        required: false
        type: string

env:
  IMAGE_NAME: ntwck/sillygirl

jobs:
  timestamp:
    runs-on: ubuntu-latest
    outputs:
      now: ${{ steps.gen.outputs.now }}
      dev_base: ${{ steps.gen.outputs.dev_base }}
    steps:
      - name: Generate timestamp
        id: gen
        shell: bash
        run: |
          n=$(date +%s%3N)
          echo "now=$n" >> $GITHUB_OUTPUT
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            echo "dev_base=$MANUAL_TAG" >> $GITHUB_OUTPUT
          else
            LATEST_RELEASE=$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/latest 2>/dev/null | grep '"tag_name"' | grep -o 'v[^"]*' || echo "")
            if [ -n "$LATEST_RELEASE" ]; then
              echo "dev_base=$LATEST_RELEASE" >> $GITHUB_OUTPUT
            else
              echo "dev_base=${{ github.ref_name }}.0" >> $GITHUB_OUTPUT
            fi
          fi
          echo "时间戳: $n"

  build:
    needs: timestamp
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            upx: false
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
            upx: false
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            ext: ""
            upx: false
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
            ext: ""
            upx: false
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            upx: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build webpack bundle
        shell: bash
        run: |
          cd proto3
          npm install
          npx webpack
          mkdir -p ../core/proto3/dist
          cp dist/sillygirl.js ../core/proto3/dist/sillygirl.js

      - name: Inject compile time version
        shell: bash
        run: |
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            echo "package core" > core/compile_time.go
            echo "var compiled_at = \"$MANUAL_TAG\"" >> core/compile_time.go
          else
            echo "package core" > core/compile_time.go
            echo "var compiled_at = \"${{ needs.timestamp.outputs.dev_base }}-dev.${{ needs.timestamp.outputs.now }}\"" >> core/compile_time.go
          fi
          echo "编译版本: $(cat core/compile_time.go)"

      - name: Build
        shell: bash
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0             go build -ldflags "-s -w"             -o sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

      - name: UPX compress
        if: matrix.upx
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}
          path: sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}


  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.2

      - name: Build linux/amd64 binary
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o sillyGirl_linux_amd64

      - name: Build linux/arm64 binary
        shell: bash
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w" -o sillyGirl_linux_arm64

      - name: Determine docker tags
        id: dockertags
        shell: bash
        run: |
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            # 手动发布正式版 → latest + 版本号 + sha
            echo "tags<<__EOF__" >> $GITHUB_OUTPUT
            echo "${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
            echo "${{ env.IMAGE_NAME }}:${MANUAL_TAG}" >> $GITHUB_OUTPUT
            echo "__EOF__" >> $GITHUB_OUTPUT
          else
            # 留空 → dev build，不覆盖 latest
            echo "tags<<__EOF__" >> $GITHUB_OUTPUT
            echo "${{ env.IMAGE_NAME }}:dev" >> $GITHUB_OUTPUT
            echo "__EOF__" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.dockertags.outputs.tags }}

  release:
    needs: [timestamp, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download linux/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_linux_amd64
          path: artifacts/

      - name: Download linux/arm64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_linux_arm64
          path: artifacts/

      - name: Download darwin/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_darwin_amd64
          path: artifacts/

      - name: Download darwin/arm64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_darwin_arm64
          path: artifacts/

      - name: Download windows/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_windows_amd64
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f -ls

      - name: Determine tag name
        id: release
        shell: bash
        run: |
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            echo "tag=$MANUAL_TAG" >> $GITHUB_OUTPUT
            echo "mode=update" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.timestamp.outputs.dev_base }}-dev.${{ needs.timestamp.outputs.now }}" >> $GITHUB_OUTPUT
            echo "mode=create" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Body
        if: steps.release.outputs.mode == 'create'
        shell: bash
        run: |
          cat > /tmp/release_body.md << "HEREDOC"
          ## 🎉 自动构建

          此版本由 CI 自动构建。

          ### 构建信息

          | 项目 | 值 |
          |------|----|
          | 分支 | BRANCH_PLACEHOLDER |
          | 提交 | SHA_PLACEHOLDER |
          | 触发事件 | EVENT_PLACEHOLDER |

          ### 支持平台

          - **Linux**: amd64 / arm64
          - **macOS**: amd64 / arm64 (Intel + Apple Silicon)
          - **Windows**: amd64
          HEREDOC
          sed -i "s|BRANCH_PLACEHOLDER|${{ github.ref_name }}|g" /tmp/release_body.md
          sed -i "s|SHA_PLACEHOLDER|${{ github.sha }}|g" /tmp/release_body.md
          sed -i "s|EVENT_PLACEHOLDER|${{ github.event_name }}|g" /tmp/release_body.md
          echo "bodyfile=/tmp/release_body.md" >> $GITHUB_OUTPUT
        id: bodygen

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.bodygen.outputs.bodyfile }}
          prerelease: ${{ steps.release.outputs.mode == 'create' && 'true' || 'false' }}
          fail_on_unmatched_files: false
          files: |
            artifacts/sillyGirl_linux_amd64
            artifacts/sillyGirl_linux_arm64
            artifacts/sillyGirl_darwin_amd64
            artifacts/sillyGirl_darwin_arm64
            artifacts/sillyGirl_windows_amd64.exe

      - name: Clean up pre-release tags（正式版发布后清理 dev 构建）
        if: steps.release.outputs.mode == 'update'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "清理 pre-release release + tag..."
          gh release list --repo ${{ github.repository }} --limit 100 --json isPrerelease,tagName --jq '.[] | select(.isPrerelease) | .tagName' 2>/dev/null | while read tag; do
            if [ -n "$tag" ]; then
              echo "删除 release: $tag"
              gh release delete "$tag" --repo ${{ github.repository }} -y || true
              echo "删除 git tag: $tag"
              git tag -d "$tag" 2>/dev/null || true
              git push origin --delete "$tag" 2>/dev/null || true
            fi
          done
          echo "清理完成"
