name: Build

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ v2.* ]
    paths:
      - 'core/**'
      - 'proto3/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerfile'
      - 'Makefile'
      - 'install.sh'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ v2.* ]
    paths:
      - 'core/**'
      - 'proto3/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerfile'
      - 'Makefile'
      - 'install.sh'
      - '.github/workflows/build.yml'

env:
  IMAGE_NAME: ntwck/sillygirl

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            upx: true
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
            upx: true
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            ext: ""
            upx: false
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
            ext: ""
            upx: false
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            upx: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build webpack bundle
        shell: bash
        run: |
          cd proto3
          npm install
          npx webpack
          mkdir -p ../core/proto3/dist
          cp dist/sillygirl.js ../core/proto3/dist/sillygirl.js

      - name: Inject build time
        shell: bash
        run: |
          n=$(date +%s%3N)
          echo "package core" > core/compile_time.go
          echo "var compiled_at = \"$n\"" >> core/compile_time.go

      - name: Build
        if: github.event_name != 'pull_request' || (matrix.goos == 'linux' && (matrix.goarch == 'amd64' || matrix.goarch == 'arm64'))
        shell: bash
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0             go build -ldflags "-s -w"             -o sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

      - name: UPX compress
        if: matrix.upx && (github.event_name != 'pull_request' || matrix.goarch == 'amd64')
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload artifact
        if: github.event_name != 'pull_request' || (matrix.goos == 'linux' && (matrix.goarch == 'amd64' || matrix.goarch == 'arm64'))
        uses: actions/upload-artifact@v4
        with:
          name: sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}
          path: sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}


  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.2

      - name: Build linux/amd64 binary
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o sillyGirl_linux_amd64

      - name: Build linux/arm64 binary
        shell: bash
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w" -o sillyGirl_linux_arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    # 仅在合并后运行，PR 不做 release
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download linux/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_linux_amd64
          path: artifacts/

      - name: Download linux/arm64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_linux_arm64
          path: artifacts/



      - name: Download darwin/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_darwin_amd64
          path: artifacts/

      - name: Download darwin/arm64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_darwin_arm64
          path: artifacts/

      - name: Download windows/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_windows_amd64
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f -ls

      - name: Generate release tag
        id: release
        shell: bash
        run: |
          # 从分支名提取版本号（v2.1 → 2.1.0, v2.2 → 2.2.0）
          BRANCH="${GITHUB_REF_NAME}"
          BASE_VER=$(echo "$BRANCH" | sed -n 's/^v\([0-9]\+\.[0-9]\+\)$/\1.0/p')
          if [ -z "$BASE_VER" ]; then
            BASE_VER="2.1.0"
          fi
          # 读取编译时间戳
          COMPILE_TS=$(grep compiled_at core/compile_time.go 2>/dev/null | grep -o '"[^"]*"' | tr -d '"')
          if [ -z "$COMPILE_TS" ]; then
            COMPILE_TS=$(date +%s%3N)
          fi
          TAG="v${BASE_VER}-${COMPILE_TS}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "base_ver=$BASE_VER" >> $GITHUB_OUTPUT

      - name: Delete old prereleases with same version prefix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_VER="${{ steps.release.outputs.base_ver }}"
          # 查找同一大版本下的旧 prerelease tag
          for OLD_TAG in $(gh release list --repo ${{ github.repository }} --limit 50 --json tagName --jq '.[].tagName' 2>/dev/null); do
            if echo "$OLD_TAG" | grep -q "^v${BASE_VER}-"; then
              echo "删除旧版本: $OLD_TAG"
              gh release delete "$OLD_TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
              git push origin --delete refs/tags/"$OLD_TAG" 2>/dev/null || true
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }} (Pre-release)
          body: |
            ## 更新内容

            - Node.js 插件支持 @http 路由注册到傻妞 8080 服务（反向代理模式）
            - 支持系统 Node.js（不再依赖远程下载的自定义 node）
            - Webpack 打包 sillygirl 模块，提供更完整的 npm 生态支持
            - Docker 多架构镜像（linux/amd64, linux/arm64）

            ## 使用方式

            详见 README.md
          prerelease: true
          files: |
            artifacts/sillyGirl_linux_amd64
            artifacts/sillyGirl_linux_arm64
            artifacts/sillyGirl_darwin_amd64
            artifacts/sillyGirl_darwin_arm64
            artifacts/sillyGirl_windows_amd64.exe
