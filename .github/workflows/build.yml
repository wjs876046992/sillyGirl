name: Build

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ v2.* ]
    paths:
      - 'core/**'
      - 'proto3/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerfile'
      - 'Makefile'
      - 'install.sh'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ v2.* ]
    paths:
      - 'core/**'
      - 'proto3/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerfile'
      - 'Makefile'
      - 'install.sh'
      - '.github/workflows/build.yml'
  # 手动触发：发布正式版时补传二进制文件到指定 release
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag（留空则自动生成 分支名-时间戳）'
        required: false
        type: string

env:
  IMAGE_NAME: ntwck/sillygirl

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            upx: true
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
            upx: true
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            ext: ""
            upx: false
          - os: ubuntu-latest
            goos: darwin
            goarch: arm64
            ext: ""
            upx: false
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            upx: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build webpack bundle
        shell: bash
        run: |
          cd proto3
          npm install
          npx webpack
          mkdir -p ../core/proto3/dist
          cp dist/sillygirl.js ../core/proto3/dist/sillygirl.js

      - name: Inject compile time version
        shell: bash
        run: |
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            # 手动发布：使用 release tag 作为版本号
            echo "package core" > core/compile_time.go
            echo "var compiled_at = \"$MANUAL_TAG\"" >> core/compile_time.go
          else
            # 自动构建：获取最新 release 版本号，递进补丁号作为 dev 基准
            LATEST_RELEASE=$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/latest 2>/dev/null | grep '"tag_name"' | grep -o 'v[^"]*' || echo "")
            if [ -n "$LATEST_RELEASE" ]; then
              # v2.1.3 → v2.1.3 直接作为 dev 前缀
              DEV_BASE="$LATEST_RELEASE"
            else
              # 没有 release 过，从分支名生成基础版本
              DEV_BASE="${{ github.ref_name }}.0"
            fi
            n=$(date +%s%3N)
            echo "package core" > core/compile_time.go
            echo "var compiled_at = \"${DEV_BASE}-dev.$n\"" >> core/compile_time.go
          fi
          echo "编译版本: $(cat core/compile_time.go)"

      - name: Build
        if: github.event_name != 'pull_request' || (matrix.goos == 'linux' && (matrix.goarch == 'amd64' || matrix.goarch == 'arm64'))
        shell: bash
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0             go build -ldflags "-s -w"             -o sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

      - name: UPX compress
        if: matrix.upx && (github.event_name != 'pull_request' || matrix.goarch == 'amd64')
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload artifact
        if: github.event_name != 'pull_request' || (matrix.goos == 'linux' && (matrix.goarch == 'amd64' || matrix.goarch == 'arm64'))
        uses: actions/upload-artifact@v4
        with:
          name: sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}
          path: sillyGirl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}


  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.2

      - name: Build linux/amd64 binary
        shell: bash
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o sillyGirl_linux_amd64

      - name: Build linux/arm64 binary
        shell: bash
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w" -o sillyGirl_linux_arm64

      - name: Determine docker tags
        id: dockertags
        shell: bash
        run: |
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            # 手动发布正式版 → latest + 版本号 + sha
            echo "tags<<__EOF__" >> $GITHUB_OUTPUT
            echo "${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
            echo "${{ env.IMAGE_NAME }}:${MANUAL_TAG}" >> $GITHUB_OUTPUT
            echo "__EOF__" >> $GITHUB_OUTPUT
          else
            # 自动构建（分支 push）→ dev，不覆盖 latest
            echo "tags<<__EOF__" >> $GITHUB_OUTPUT
            echo "${{ env.IMAGE_NAME }}:dev" >> $GITHUB_OUTPUT
            echo "__EOF__" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.dockertags.outputs.tags }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    # 仅在合并后运行，PR / workflow_dispatch 不做 release
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download linux/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_linux_amd64
          path: artifacts/

      - name: Download linux/arm64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_linux_arm64
          path: artifacts/

      - name: Download darwin/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_darwin_amd64
          path: artifacts/

      - name: Download darwin/arm64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_darwin_arm64
          path: artifacts/

      - name: Download windows/amd64
        uses: actions/download-artifact@v4
        with:
          name: sillyGirl_windows_amd64
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f -ls

      - name: Inject compile time version
        shell: bash
        run: |
          LATEST_RELEASE=$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/latest 2>/dev/null | grep '"tag_name"' | grep -o 'v[^"]*' || echo "")
          if [ -n "$LATEST_RELEASE" ]; then
            DEV_BASE="$LATEST_RELEASE"
          else
            DEV_BASE="${{ github.ref_name }}.0"
          fi
          n=$(date +%s%3N)
          echo "package core" > core/compile_time.go
          echo "var compiled_at = \"${DEV_BASE}-dev.$n\"" >> core/compile_time.go
          echo "编译版本: $(cat core/compile_time.go)"

      - name: Determine tag name
        id: release
        shell: bash
        run: |
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            echo "tag=$MANUAL_TAG" >> $GITHUB_OUTPUT
            echo "mode=update" >> $GITHUB_OUTPUT
          else
            COMPILE_TS=$(grep compiled_at core/compile_time.go 2>/dev/null | grep -o '"[^"]*"' | tr -d '"')
            echo "tag=${COMPILE_TS}" >> $GITHUB_OUTPUT
            echo "mode=create" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Body
        if: steps.release.outputs.mode == 'create'
        shell: bash
        run: |
          cat > /tmp/release_body.md << "HEREDOC"
          ## 🎉 自动构建

          此版本由 CI 自动构建。

          ### 构建信息

          | 项目 | 值 |
          |------|----|
          | 分支 | BRANCH_PLACEHOLDER |
          | 提交 | SHA_PLACEHOLDER |
          | 触发事件 | EVENT_PLACEHOLDER |

          ### 支持平台

          - **Linux**: amd64 / arm64
          - **macOS**: amd64 / arm64 (Intel + Apple Silicon)
          - **Windows**: amd64
          HEREDOC
          sed -i "s|BRANCH_PLACEHOLDER|${{ github.ref_name }}|g" /tmp/release_body.md
          sed -i "s|SHA_PLACEHOLDER|${{ github.sha }}|g" /tmp/release_body.md
          sed -i "s|EVENT_PLACEHOLDER|${{ github.event_name }}|g" /tmp/release_body.md
          echo "bodyfile=/tmp/release_body.md" >> $GITHUB_OUTPUT
        id: bodygen

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.bodygen.outputs.bodyfile }}
          prerelease: ${{ steps.release.outputs.mode == 'create' && 'true' || 'false' }}
          fail_on_unmatched_files: false
          files: |
            artifacts/sillyGirl_linux_amd64
            artifacts/sillyGirl_linux_arm64
            artifacts/sillyGirl_darwin_amd64
            artifacts/sillyGirl_darwin_arm64
            artifacts/sillyGirl_windows_amd64.exe
